<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
    <link rel="stylesheet" href="./src/output.css">
</head>
<body class="p-5 grid place-items-center min-h-screen">
    <section class="max-w-[500px] w-full m-auto text-center">
        <h1 class="inline-block  mb-8 text-3xl font-semibold text-slate-600 relative after:content-'' after:w-full after:h-[1px] after:bg-slate-500 after:absolute after:bottom-[-4px] after:left-0">COUNTER APP</h1>
        <div class="grid grid-cols-3 gap-3">
            <div id="minus" class="rounded-xl bg-red-200 px-5 py-3 text-2xl font-bold text-center"><span>-</span></div>
            <div id="display" class="rounded-xl bg-green-200 px-5 py-3 text-2xl font-bold text-center"></div>
            <div id="plus" class="rounded-xl bg-sky-200 px-5 py-3 text-2xl font-semibold text-center">+</div>
            <div id="reset" class="col-span-3 rounded-xl bg-amber-200 p-4 text-center text-2xl font-semibold"><span>Reset</span></div>
        </div>
    </section>

    <script src="./js/main.js"></script>
</body>
</html>
